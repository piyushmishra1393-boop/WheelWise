<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us | WheelWise</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="library.css">    <link rel="stylesheet" href="theme.css">
</head><body><header class="lib-head"><a href="index.html">← WheelWise</a><nav><a href="news.html">News</a><a href="brands.html">Cars</a><a href="reviews.html">Reviews</a></nav></header><main class="lib-wrap"><p class="eyebrow">WHEELWISE</p><h1>Contact Us</h1><div class="panel"><p>Send a message to the WheelWise team.</p><form id="contactForm" class="form-grid"><label>Name<input id="contactName" required maxlength="100"></label><label>Email<input id="contactEmail" type="email" required></label><label class="wide">Subject<input id="contactSubject"></label><label class="wide">Message<textarea id="contactMessage" rows="5" required minlength="5"></textarea></label><div class="wide"><button class="primary" type="submit">Send message</button><p id="contactStatus" class="muted" aria-live="polite"></p></div></form></div></main><script src="api-config.js"></script><script src="api.js"></script><script>document.getElementById("contactForm").addEventListener("submit",async function(e){e.preventDefault();const s=document.getElementById("contactStatus");try{await WheelWiseAPI.submitContact({name:document.getElementById("contactName").value,email:document.getElementById("contactEmail").value,subject:document.getElementById("contactSubject").value,message:document.getElementById("contactMessage").value});s.textContent="Your message has been sent.";this.reset();}catch(err){s.textContent=err.message;}});</script>    <script src="theme.js"></script>
</body></html>
